clone:
  git:
    image: woodpeckerci/plugin-git:2.10.0
    settings:
      partial: false
      depth: 1

labels:
  location: production-80
  repo: zengwenliang416/new-api

when:
  - event: manual
    branch: main
  - event: push
    branch: main
    path:
      exclude:
        - .woodpecker/**
        - "**/*.md"

concurrency:
  limit: 1
  group: new-api-production-80

steps:
  - name: deploy-production
    image: docker:29-cli
    commands:
      - apk add --no-cache bash
      - mkdir -p /tmp/docker-config
      - cp /docker-config/config.json /tmp/docker-config/config.json
      - chmod 600 /tmp/docker-config/config.json
      - export DOCKER_CONFIG=/tmp/docker-config
      - bash -n ops/woodpecker/deploy.sh
      - bash ops/woodpecker/deploy.sh
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/new-api:/root/new-api
      - /usr/libexec/docker/cli-plugins/docker-compose:/usr/libexec/docker/cli-plugins/docker-compose:ro
      - /root/.docker/new-api-ci:/docker-config:ro
